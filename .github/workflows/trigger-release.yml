name: Trigger release build

on:
  push:
    branches:
      - build

permissions:
  actions: write

concurrency:
  group: trigger-release
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref release
